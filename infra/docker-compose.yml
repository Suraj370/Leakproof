name: leakproof

services:
  backend:
    build:
      context: ../backend
      target: runtime
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-}   # unset = in-memory demo catalog
      REDIS_URL: ${REDIS_URL:-}
    ports: ["8080:8080"]
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: runtime
    depends_on: [backend]
    ports: ["3000:80"]
    restart: unless-stopped

  # Reference-data stores. The guest-mode API does not write user data to either.
  postgres:
    image: postgres:16-alpine
    profiles: ["data", "itest"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth -d leakproof"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      POSTGRES_USER: wealth
      POSTGRES_PASSWORD: wealth_dev_only
      POSTGRES_DB: leakproof
    volumes:
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    profiles: ["data"]
    command: ["redis-server", "--save", "", "--appendonly", "no"] # no persistence at all
    ports: ["6379:6379"]

  # Reference-data loader: docker compose -f infra/docker-compose.yml --profile data run --rm ingest funds /data/funds.sample.csv
  ingest:
    profiles: ["data"]
    build:
      context: ../backend
      target: ingest
    environment:
      DATABASE_URL: postgres://wealth:wealth_dev_only@postgres:5432/leakproof
    volumes:
      - ../data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  # DB integration test: docker compose -f infra/docker-compose.yml --profile itest run --rm --build backend-itest
  backend-itest:
    profiles: ["itest"]
    build:
      context: ../backend
      target: itest
    environment:
      TEST_DATABASE_URL: postgres://wealth:wealth_dev_only@postgres:5432/leakproof
    depends_on:
      postgres:
        condition: service_healthy

  # docker compose --profile test run --rm backend-test / frontend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ../backend
      target: test
  frontend-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: test
